version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: ddosgotchi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:////app/data/ddosgotchi.db
    networks:
      - ddosgotchi-network
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true  # Needed for ping and network monitoring

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: ddosgotchi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ddosgotchi-network
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

networks:
  ddosgotchi-network:
    driver: bridge

volumes:
  data:
    driver: local
