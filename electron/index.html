<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDoS Gotchi v3.0 - HUD Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <!-- Top progress bar - Network Load -->
    <div id="a1">
        <div id="a11"></div>
    </div>

    <!-- Latency Gauge -->
    <div id="a2">
        <div id="a21"></div>
    </div>

    <!-- Left side - Connection Ports/IPs -->
    <div id="a3"></div>

    <!-- Left side - Connection Activity Bars -->
    <div id="a4"></div>

    <!-- Bottom - Active Connection Indicators -->
    <div id="a5"></div>

    <!-- Top center - Pwnagotchi Face + Title -->
    <div id="a6">
        <span id="gotchi-face">(◕‿‿◕)</span>
        <br>
        <span id="gotchi-title">DDOS GOTCHI</span>
    </div>

    <!-- Top right - Network Stats Panel -->
    <div id="a7">
        <span id="a71">network monitor</span>
        <span id="a73">
            <b class="a731" id="stat-connections">0</b>
            <b class="a732" id="stat-label-conn">CONN</b>
        </span>
        <span id="a74">
            <b class="a741" id="stat-unique-ips">0</b>
            <b class="a742" id="stat-label-ips">IPs</b>
            <b class="a743" id="stat-threat">SAFE</b>
        </span>
        <span id="a76" id="current-time">00:00:00</span>
    </div>

    <!-- Right side - Packet Loss Graph -->
    <div id="a8">
        <div id="a81"></div>
    </div>

    <!-- Bottom right - Live IP Addresses -->
    <div id="a9">
        <span class="ip-segment">0</span>:
        <span class="ip-segment">0</span>.
        <span class="ip-segment">0</span>:
        <span class="ip-segment">0</span>&nbsp;
        <span class="ip-segment">0</span>
    </div>

    <!-- Bottom center - Threat Level Bar + Quote -->
    <div id="a10">
        <span id="threat-quote">monitoring packets...</span>
        <span id="threat-bar"></span>
    </div>

    <!-- Bottom left - Connections Per Second Bar Graph -->
    <div id="b1">
        <span class="b11"></span>
        <span class="b12"></span>
        <span class="b13"></span>
        <span class="b14"></span>
        <span class="b15"></span>
        <span class="b16"></span>
        <span class="b17"></span>
        <span class="b18"></span>
        <span class="b19"></span>
        <span class="b110"></span>
    </div>

    <!-- Center 3D Figure - Main Status Indicator -->
    <div id="figure">
        <!-- Info panel on left of figure -->
        <div id="a7" class="figure-info">
            <span id="a71">latency</span>
            <span id="a73">
                <b class="a731" id="fig-latency">0</b>
                <b class="a732">ms</b>
            </span>
            <span id="a74">
                <b class="a741" id="fig-packet-loss">0</b>
                <b class="a742">%</b>
                <b class="a743">LOSS</b>
            </span>
            <span id="a76">packet analysis</span>
        </div>

        <!-- Outer rotating ring -->
        <div id="f1"></div>
        <div id="f2"></div>

        <!-- Main blue circle with crosshairs -->
        <div id="f3">
            <div id="f31">
                <span class="f311"><b></b></span>
                <span class="f312"><b></b></span>
            </div>
            <div id="f32">
                <span class="f321"></span>
                <span class="f322"></span>
            </div>
            <div id="f33"></div>
            <div id="f34"></div>
        </div>

        <!-- Middle ring with cross -->
        <div id="f4">
            <div id="f41"></div>
            <div id="f42"></div>
            <div id="f43" class="f431"></div>
            <div id="f43" class="f432"></div>
            <div id="f43" class="f433"></div>
            <div id="f43" class="f434"></div>
        </div>

        <!-- Rotating tick marks -->
        <div id="f5"></div>

        <!-- Inner rings -->
        <div id="f6"></div>
        <div id="f7">
            <div id="f71"></div>
            <div id="f72"></div>
        </div>
        <div id="f8">
            <div id="f81"></div>
            <div id="f82"></div>
        </div>

        <!-- Center dot -->
        <div id="f9">
            <span></span>
        </div>
    </div>

    <!-- Connection Log Overlay (custom addition) -->
    <div id="connection-log-panel">
        <div class="log-title">▼ LIVE CONNECTIONS</div>
        <div id="connection-log"></div>
    </div>
</div>

<script src="renderer.js"></script>

</body>
</html>
